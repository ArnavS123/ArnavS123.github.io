<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arnav — Inside the Chip</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background-color: #111713;

      background-image:
        linear-gradient(
          to right,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        );

      background-size: 24px 24px;
    }

    .circuit {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Copper wiring */
    .wire {
      fill: none;
      stroke: #78583e;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wire-secondary {
      stroke: #4d4032;
      stroke-width: 2;
    }

    .wire-ternary {
      stroke: #536e7c;
      stroke-width: 2;
    }

    /* Chip contacts */
    .pins {
      fill: none;
      stroke: #76776b;
      stroke-width: 5;
      stroke-linecap: butt;
    }

    /* Each chip supplies its own muted colors. */
    .pc {
      --chip-fill: #1c2b25;
      --chip-border: #526d5c;
      --chip-accent: #94aa98;
    }

    .rf {
      --chip-fill: #202934;
      --chip-border: #506378;
      --chip-accent: #91a4bb;
    }

    .control {
      --chip-fill: #2b2532;
      --chip-border: #685975;
      --chip-accent: #aa99b7;
    }

    .alu {
      --chip-fill: #302620;
      --chip-border: #78604a;
      --chip-accent: #b29b80;
    }

    .memory {
      --chip-fill: #1d2c2e;
      --chip-border: #4c7073;
      --chip-accent: #8badae;
    }

    .io {
      --chip-fill: #2c2c21;
      --chip-border: #6c6d4f;
      --chip-accent: #a8aa87;
    }

    .chip-body {
      fill: var(--chip-fill);
      stroke: var(--chip-border);
      stroke-width: 1.5;
    }

    .chip-inset {
      fill: none;
      stroke: var(--chip-border);
      stroke-width: 1;
      opacity: 0.35;
    }

    .chip-index {
      fill: var(--chip-accent);
      font: 10px monospace;
      letter-spacing: 2px;
    }

    .chip-name {
      fill: #d4d8cf;
      font: 500 28px monospace;
    }

    .chip-name-small {
      font-size: 21px;
    }

    .chip-description {
      fill: var(--chip-accent);
      font: 11px monospace;
    }

    .orientation-dot {
      fill: var(--chip-accent);
      opacity: 0.6;
    }

    /* Make chips show a hand cursor */
    .circuit > g[role="button"] {
      cursor: pointer;
    }

    /* Highlight the selected chip and keyboard-focused chip */
    .circuit > g[role="button"]:focus-visible {
      outline: none;
    }

    .circuit > g[role="button"]:focus-visible .chip-body,
    .circuit > g.is-current .chip-body {
      stroke: var(--chip-accent);
      stroke-width: 2.5;
    }

    /* Moving signal dots */
    .signal-pulse {
      stroke: none;
      pointer-events: none;
    }

    .signal-pulse.primary {
      fill: #ffc16b;
      filter: drop-shadow(0 0 5px #ffc16b);
    }

    .signal-pulse.secondary {
      fill: #d1a277;
      filter: drop-shadow(0 0 5px #d1a277);
    }

    .signal-pulse.ternary {
      fill: #a4d5ef;
      filter: drop-shadow(0 0 5px #a4d5ef);
    }

    /* Status text in the top-left corner */
    .route-status {
      position: fixed;
      top: 18px;
      left: 20px;
      margin: 0;
      padding: 10px 14px;
      border: 1px solid #ffffff18;
      border-radius: 6px;
      background: #111713e8;
      color: #a5aea5;
      font: 12px monospace;
      pointer-events: none;
    }

    /* Hide the status textbox */
    .route-status {
      display: none;
    }

    /* Remove the browser's rectangular focus outline */
    .circuit > g[role="button"],
    .circuit > g[role="button"]:focus,
    .circuit > g[role="button"]:focus-visible {
      outline: none;
    }
  </style>
</head>

<body>
  <svg
    class="circuit"
    viewBox="-24 -12 1224 812"
    preserveAspectRatio="xMidYMid meet"
    role="group"
    aria-labelledby="circuit-title circuit-description"
  >
    <title id="circuit-title">Arnav's CPU portfolio circuit</title>

    <desc id="circuit-description">
      An interactive circuit connecting PC, RF, CU, ALU, memory,
      and I/O. Select a connected chip to send three synchronized
      signal pulses toward it. Connections work in both directions.
    </desc>

    <defs>
      <!--
        Reusable contacts for a 240 × 160 chip.
        Coordinates are relative to the chip's top-left corner.
      -->
      <g id="chip-pins" class="pins">
        <!-- Left -->
        <path d="
          M -14 48 H 0
          M -14 80 H 0
          M -14 112 H 0
        " />

        <!-- Right -->
        <path d="
          M 240 48 H 254
          M 240 80 H 254
          M 240 112 H 254
        " />

        <!-- Top -->
        <path d="
          M 48 -14 V 0
          M 80 -14 V 0
          M 120 -14 V 0
          M 160 -14 V 0
          M 192 -14 V 0
        " />

        <!-- Bottom -->
        <path d="
          M 48 160 V 174
          M 80 160 V 174
          M 120 160 V 174
          M 160 160 V 174
          M 192 160 V 174
        " />
      </g>
    </defs>

    <!--
      WIRES
      Drawn before the chips so their ends sit behind the contacts.
    -->

    <g class="wire">
      <g data-from="pc" data-to="rf">
        <path d="M 300 360 H 410 V 540 H 510" />
        <path class="wire-secondary"
              d="M 300 328 H 422 V 508 H 510" />
        <path class="wire-ternary"
              d="M 300 392 H 398 V 572 H 510" />
      </g>

      <g data-from="rf" data-to="control">
        <path d="M 630 460 V 360 H 540 V 230" />
        <path class="wire-secondary"
              d="M 590 460 V 372 H 500 V 230" />
        <path class="wire-ternary"
              d="M 670 460 V 348 H 580 V 230" />
      </g>

      <g data-from="control" data-to="alu">
        <path d="M 660 150 H 755 V 230 H 850" />
        <path class="wire-secondary"
              d="M 660 118 H 767 V 198 H 850" />
        <path class="wire-ternary"
              d="M 660 182 H 743 V 262 H 850" />
      </g>

      <g data-from="alu" data-to="memory">
        <path d="M 970 310 V 365 H 1010 V 420" />
        <path class="wire-secondary"
              d="M 930 310 V 377 H 970 V 420" />
        <path class="wire-ternary"
              d="M 1010 310 V 353 H 1050 V 420" />
      </g>

      <g data-from="memory" data-to="io">
        <path d="M 1010 580 V 750 H 250 V 710" />
        <path class="wire-secondary"
              d="M 970 580 V 738 H 290 V 710" />
        <path class="wire-ternary"
              d="M 1050 580 V 762 H 210 V 710" />
      </g>

      <g data-from="rf" data-to="io">
        <path d="M 630 620 V 666 H 434 V 630 H 370" />
        <path class="wire-secondary"
              d="M 590 620 V 650 H 450 V 598 H 370" />
        <path class="wire-ternary"
              d="M 670 620 V 682 H 418 V 662 H 370" />
      </g>

      <g data-from="rf" data-to="memory">
        <path d="M 750 540 H 812 V 500 H 890" />
        <path class="wire-secondary"
              d="M 750 508 H 800 V 468 H 890" />
        <path class="wire-ternary"
              d="M 750 572 H 824 V 532 H 890" />
      </g>

      <g data-from="io" data-to="pc">
        <path d="M 250 550 V 498 H 180 V 440" />
        <path class="wire-secondary"
              d="M 210 550 V 510 H 140 V 440" />
        <path class="wire-ternary"
              d="M 290 550 V 486 H 220 V 440" />
      </g>

      <g data-from="pc" data-to="control">
        <path d="M 180 280 V 150 H 420" />
        <path class="wire-secondary"
              d="M 140 280 V 118 H 420" />
        <path class="wire-ternary"
              d="M 220 280 V 182 H 420" />
      </g>

      <!--
        I/O → CU

        I/O upper pin  → CU left pin   (inner route)
        I/O middle pin → CU middle pin (middle route)
        I/O lower pin  → CU right pin  (outer route)
      -->
      <g data-from="io" data-to="control">
        <!-- Middle wire -->
        <path d="
          M 130 630
          H 20
          V 32
          H 540
          V 70
        " />

        <!-- Inner wire -->
        <path class="wire-secondary" d="
          M 130 598
          H 32
          V 44
          H 500
          V 70
        " />

        <!-- Outer wire -->
        <path class="wire-ternary" d="
          M 130 662
          H 8
          V 20
          H 580
          V 70
        " />
      </g>
    </g>

    <!-- PC -->
    <g class="pc" transform="translate(60 280)">
      <use href="#chip-pins" />

      <rect class="chip-body" width="240" height="160" rx="7" />
      <rect
        class="chip-inset"
        x="9" y="9" width="222" height="142" rx="3"
      />

      <circle class="orientation-dot" cx="221" cy="19" r="3" />

      <text class="chip-index" x="24" y="35">01 / START</text>
      <text class="chip-name" x="24" y="82">PC</text>
      <text class="chip-description" x="24" y="119">
        Intro & interests
      </text>
    </g>

    <!-- Register File -->
    <g class="rf" transform="translate(510 460)">
      <use href="#chip-pins" />

      <rect class="chip-body" width="240" height="160" rx="7" />
      <rect
        class="chip-inset"
        x="9" y="9" width="222" height="142" rx="3"
      />

      <circle class="orientation-dot" cx="221" cy="19" r="3" />

      <text class="chip-index" x="24" y="35">02 / REGISTER FILE</text>
      <text class="chip-name" x="24" y="82">RF</text>
      <text class="chip-description" x="24" y="119">
        Older & smaller projects
      </text>
    </g>

    <!-- Control Unit -->
    <g class="control" transform="translate(420 70)">
      <use href="#chip-pins" />

      <rect class="chip-body" width="240" height="160" rx="7" />
      <rect
        class="chip-inset"
        x="9" y="9" width="222" height="142" rx="3"
      />

      <circle class="orientation-dot" cx="221" cy="19" r="3" />

      <text class="chip-index" x="24" y="35">03 / CONTROL UNIT</text>
      <text class="chip-name" x="24" y="82">CU</text>
      <text class="chip-description" x="24" y="119">
        Custom CPU & assembler
      </text>
    </g>

    <!-- ALU -->
    <g class="alu" transform="translate(850 150)">
      <use href="#chip-pins" />

      <rect class="chip-body" width="240" height="160" rx="7" />
      <rect
        class="chip-inset"
        x="9" y="9" width="222" height="142" rx="3"
      />

      <circle class="orientation-dot" cx="221" cy="19" r="3" />

      <text class="chip-index" x="24" y="35">04 / ALU</text>
      <text class="chip-name" x="24" y="82">ALU</text>
      <text class="chip-description" x="24" y="119">
        NACAIS & optimizer
      </text>
    </g>

    <!-- Memory / Cache -->
    <g class="memory" transform="translate(890 420)">
      <use href="#chip-pins" />

      <rect class="chip-body" width="240" height="160" rx="7" />
      <rect
        class="chip-inset"
        x="9" y="9" width="222" height="142" rx="3"
      />

      <circle class="orientation-dot" cx="221" cy="19" r="3" />

      <text class="chip-index" x="24" y="35">05 / MEMORY & CACHE</text>
      <text class="chip-name chip-name-small" x="24" y="82">
        MEMORY
      </text>
      <text class="chip-description" x="24" y="119">
        OS virtual memory sim
      </text>
    </g>

    <!-- I/O -->
    <g class="io" transform="translate(130 550)">
      <use href="#chip-pins" />

      <rect class="chip-body" width="240" height="160" rx="7" />
      <rect
        class="chip-inset"
        x="9" y="9" width="222" height="142" rx="3"
      />

      <circle class="orientation-dot" cx="221" cy="19" r="3" />

      <text class="chip-index" x="24" y="35">06 / INPUT & OUTPUT</text>
      <text class="chip-name" x="24" y="82">I/O</text>
      <text class="chip-description" x="24" y="119">
        Links & contact
      </text>
    </g>
  </svg>
  <p id="route-status" class="route-status" role="status"></p>
  <script>
    const svg = document.querySelector(".circuit");
    const status = document.querySelector("#route-status");

    const SVG_NS = "http://www.w3.org/2000/svg";
    const TRAVEL_TIME = 1200; // milliseconds for all three pulses

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const names = {
      pc: "PC",
      rf: "RF",
      control: "CU",
      alu: "ALU",
      memory: "Memory",
      io: "I/O"
    };

    const chips = {};

    for (const id of Object.keys(names)) {
      chips[id] = svg.querySelector(`g.${id}`);
    }

    // Read the connections directly from the SVG.
    const connections = Array.from(
      svg.querySelectorAll("g[data-from][data-to]")
    ).map(group => ({
      from: group.dataset.from,
      to: group.dataset.to,
      paths: Array.from(group.querySelectorAll("path"))
    }));

    // Place pulses over wires, but underneath the chips and their pins.
    const pulseLayer = document.createElementNS(SVG_NS, "g");
    pulseLayer.setAttribute("aria-hidden", "true");
    pulseLayer.style.pointerEvents = "none";

    const wires = svg.querySelector("g.wire");
    wires.after(pulseLayer);

    let currentChip = "pc";
    let travelling = false;

    function findConnection(from, to) {
      return connections.find(connection =>
        (connection.from === from && connection.to === to) ||
        (connection.from === to && connection.to === from)
      );
    }

    function findRoute(start, destination) {
      const queue = [[start]];
      const visited = new Set([start]);

      while (queue.length > 0) {
        const route = queue.shift();
        const current = route[route.length - 1];

        if (current === destination) {
          return route;
        }

        // Every wired connection can be used in either direction.
        for (const connection of connections) {
          let neighbor;

          if (connection.from === current) {
            neighbor = connection.to;
          } else if (connection.to === current) {
            neighbor = connection.from;
          } else {
            continue;
          }

          if (!visited.has(neighbor)) {
            visited.add(neighbor);
            queue.push([...route, neighbor]);
          }
        }
      }

      return null;
    }

    function showCurrentChip() {
      for (const [id, chip] of Object.entries(chips)) {
        const selected = id === currentChip;

        chip.classList.toggle("is-current", selected);
        chip.setAttribute("aria-pressed", String(selected));
      }

      const neighbors = connections
        .filter(connection =>
          connection.from === currentChip ||
          connection.to === currentChip
        )
        .map(connection =>
          connection.from === currentChip
            ? connection.to
            : connection.from
        );

      status.textContent =
        `${names[currentChip]} · Connected to: ` +
        neighbors.map(id => names[id]).join(", ");
    }

    function setTravelling(value) {
      travelling = value;

      for (const chip of Object.values(chips)) {
        chip.setAttribute("aria-disabled", String(value));
      }
    }

    function makePulse(path) {
      const circle = document.createElementNS(SVG_NS, "circle");

      const color = path.classList.contains("wire-ternary")
        ? "ternary"
        : path.classList.contains("wire-secondary")
          ? "secondary"
          : "primary";

      circle.setAttribute("class", `signal-pulse ${color}`);
      circle.setAttribute("r", color === "primary" ? "4" : "3");

      return {
        circle,
        path,
        length: path.getTotalLength()
      };
    }

    function positionPulse(signal, progress, reverse) {
      // Reverse travel counts down from 100% to 0%.
      const fraction = reverse ? 1 - progress : progress;

      const point = signal.path.getPointAtLength(
        signal.length * fraction
      );

      signal.circle.setAttribute("cx", point.x);
      signal.circle.setAttribute("cy", point.y);
    }

    function animateConnection(connection, reverse) {
      const signals = connection.paths.map(makePulse);

      // Position every pulse before displaying any of them.
      for (const signal of signals) {
        positionPulse(signal, 0, reverse);
      }

      pulseLayer.append(...signals.map(signal => signal.circle));

      return new Promise(resolve => {
        let startTime;

        function frame(time) {
          if (startTime === undefined) {
            startTime = time;
          }

          const progress = Math.min(
            (time - startTime) / TRAVEL_TIME,
            1
          );

          // One shared clock updates all three signals.
          for (const signal of signals) {
            positionPulse(signal, progress, reverse);
          }

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            // Leave the final positions for one rendered frame.
            requestAnimationFrame(() => {
              for (const signal of signals) {
                signal.circle.remove();
              }

              resolve();
            });
          }
        }

        requestAnimationFrame(frame);
      });
    }

    async function travelTo(destination) {
      if (travelling || destination === currentChip) return;

      const route = findRoute(currentChip, destination);

      if (!route) {
        status.textContent =
          `No route from ${names[currentChip]} to ${names[destination]}.`;

        return;
      }

      setTravelling(true);

      try {
        for (let i = 0; i < route.length - 1; i++) {
          const from = route[i];
          const to = route[i + 1];

          const connection = findConnection(from, to);
          const reverse = connection.to === from;

          status.textContent =
            route.map(id => names[id]).join(" → ") +
            ` · Step ${i + 1} of ${route.length - 1}`;

          if (!reducedMotion.matches) {
            await animateConnection(connection, reverse);
          }

          // Highlight each chip as the signals reach it.
          currentChip = to;
          showCurrentChip();
        }
      } finally {
        pulseLayer.replaceChildren();
        setTravelling(false);
      }
    }

    // Support both clicking and keyboard navigation.
    for (const [id, chip] of Object.entries(chips)) {
      chip.setAttribute("role", "button");
      chip.setAttribute("tabindex", "0");
      chip.setAttribute("aria-label", `Go to ${names[id]}`);

      chip.addEventListener("click", () => travelTo(id));

      chip.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          travelTo(id);
        }
      });
    }

    showCurrentChip();
  </script>
</body>
</html>
