<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arnav Srivastava - Inside the Chip</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background-color: #111713;

      background-image:
        linear-gradient(
          to right,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        );

      background-size: 24px 24px;
    }

    .circuit {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Copper wiring */
    .wire {
      fill: none;
      stroke: #78583e;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wire-secondary {
      stroke: #4d4032;
      stroke-width: 2;
    }

    .wire-ternary {
      stroke: #536e7c;
      stroke-width: 2;
    }

    /* Chip contacts */
    .pins {
      fill: none;
      stroke: #76776b;
      stroke-width: 5;
      stroke-linecap: butt;
    }

    /* Each chip supplies its own muted colors. */
    .pc {
      --chip-fill: #1c2b25;
      --chip-border: #526d5c;
      --chip-accent: #94aa98;
    }

    .rf {
      --chip-fill: #202934;
      --chip-border: #506378;
      --chip-accent: #91a4bb;
    }

    .control {
      --chip-fill: #2b2532;
      --chip-border: #685975;
      --chip-accent: #aa99b7;
    }

    .alu {
      --chip-fill: #302620;
      --chip-border: #78604a;
      --chip-accent: #b29b80;
    }

    .memory {
      --chip-fill: #1d2c2e;
      --chip-border: #4c7073;
      --chip-accent: #8badae;
    }

    .io {
      --chip-fill: #2c2c21;
      --chip-border: #6c6d4f;
      --chip-accent: #a8aa87;
    }

    .chip-body {
      fill: var(--chip-fill);
      stroke: var(--chip-border);
      stroke-width: 1.5;
    }

    .chip-inset {
      fill: none;
      stroke: var(--chip-border);
      stroke-width: 1;
      opacity: 0.35;
    }

    .chip-index {
      fill: var(--chip-accent);
      font: 9px monospace;
      letter-spacing: 2px;
    }

    .chip-name {
      fill: #d4d8cf;
      font: 500 28px monospace;
    }

    .chip-name-smallA {
      font-size: 23px;
    }

    .chip-name-smallB {
      font-size: 25px;
    }

    .chip-description {
      fill: var(--chip-accent);
      font: 11px monospace;
    }

    .orientation-dot {
      fill: var(--chip-accent);
      opacity: 0.6;
    }

    /* Make chips show a hand cursor */
    .circuit > g[role="button"] {
      cursor: pointer;
    }

    /* Highlight the selected chip and keyboard-focused chip */
    .circuit > g[role="button"]:focus-visible {
      outline: none;
    }

    .circuit > g[role="button"]:focus-visible .chip-body,
    .circuit > g.is-current .chip-body {
      stroke: var(--chip-accent);
      stroke-width: 2.5;
    }

    /* Moving signal dots */
    .signal-pulse {
      stroke: none;
      pointer-events: none;
    }

    .signal-pulse.primary {
      fill: #ffc16b;
      filter: drop-shadow(0 0 5px #ffc16b);
    }

    .signal-pulse.secondary {
      fill: #d1a277;
      filter: drop-shadow(0 0 5px #d1a277);
    }

    .signal-pulse.ternary {
      fill: #a4d5ef;
      filter: drop-shadow(0 0 5px #a4d5ef);
    }

    /* Status text in the top-left corner */
    .route-status {
      position: fixed;
      top: 18px;
      left: 20px;
      margin: 0;
      padding: 10px 14px;
      border: 1px solid #ffffff18;
      border-radius: 6px;
      background: #111713e8;
      color: #a5aea5;
      font: 12px monospace;
      pointer-events: none;
    }

    /* Hide the status textbox */
    .route-status {
      display: none;
    }

    /* Remove the browser's rectangular focus outline */
    .circuit > g[role="button"],
    .circuit > g[role="button"]:focus,
    .circuit > g[role="button"]:focus-visible {
      outline: none;
    }

    /* Hide a chip's small labels while its full content is open. */
    /* Small labels on the circuit chips */
    .circuit > g[role="button"] text {
      opacity: 1;
      transition: opacity 350ms ease;
    }

    .circuit > g.content-open text {
      opacity: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .circuit > g[role="button"] text {
        transition: none;
      }
    }

    /* Shared content viewer */
    #chip-panel {
      position: fixed;
      inset: auto;
      margin: 0;
      padding: 0;

      max-width: none;
      max-height: none;

      border: none;
      background: var(--panel-fill);
      color: #d4d8cf;

      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    #chip-panel[open] {
      display: flex;
      flex-direction: column;
    }

    #chip-panel::backdrop {
      background: transparent;
    }

    .chip-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;

      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-border);
    }

    .panel-eyebrow {
      color: var(--panel-accent);
      font: 11px monospace;
      letter-spacing: 0.12em;
    }

    #close-chip {
      padding: 9px 12px;

      border: 1px solid var(--panel-border);
      border-radius: 5px;

      background: transparent;
      color: #d4d8cf;
      font: 12px monospace;
      cursor: pointer;
    }

    #close-chip:hover {
      background: #ffffff0a;
    }

    #close-chip:focus-visible,
    .panel-content a:focus-visible {
      outline: 2px solid var(--panel-accent);
      outline-offset: 3px;
    }

    .panel-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;

      padding: 24px clamp(20px, 4vw, 64px) 40px;
      scrollbar-color: var(--panel-border) var(--panel-fill);
    }

    .panel-content h1 {
      margin: 14px 0 20px;
      font-size: clamp(32px, 5vw, 64px);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 1.1;
    }

    .panel-content h2 {
      margin-top: 32px;
      font-size: 20px;
      font-weight: 500;
    }

    .panel-content p,
    .panel-content li {
      max-width: 680px;
      color: #c0c4c0;
      font-size: 16px;
      line-height: 1.8;
    }

    .panel-content .panel-lead {
      color: #e0e3dc;
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.5;
    }

    .panel-content .panel-eyebrow {
      color: var(--panel-accent);
      font-size: 11px;
    }

    .panel-content ul {
      padding-left: 20px;
    }

    .panel-content li {
      margin-bottom: 8px;
    }

    .panel-content a {
      color: var(--panel-accent);
      text-underline-offset: 4px;
    }

    .panel-content figure {
      width: 100%;
      max-width: none;
      margin: 28px 0;
    }

    .panel-content img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
    }

    .panel-content figcaption {
      margin-top: 10px;
      color: var(--panel-accent);
      font-size: 12px;
      line-height: 1.6;
    }

    /* Clickable images inside project write-ups */
    .image-expand {
      display: block;
      width: 100%;
      padding: 0;

      border: none;
      border-radius: 6px;
      background: transparent;

      cursor: zoom-in;
    }

    .image-expand:focus-visible {
      outline: 2px solid var(--panel-accent);
      outline-offset: 5px;
    }

    /* Large image viewer */
    #image-viewer {
      position: fixed;
      inset: 0;
      margin: auto;
      padding: 0;

      width: 94vw;
      height: 92dvh;
      max-width: none;
      max-height: none;

      border: 1px solid #526d5c;
      border-radius: 10px;
      background: #111713;
      color: #d4d8cf;

      overflow: hidden;
    }

    #image-viewer[open] {
      display: flex;
      flex-direction: column;
    }

    #image-viewer::backdrop {
      background: rgba(0, 0, 0, 0.82);
    }

    .image-viewer-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;

      padding: 14px 20px;
      border-bottom: 1px solid #ffffff18;

      color: #94aa98;
      font: 11px monospace;
      letter-spacing: 0.1em;
    }

    #close-image {
      padding: 9px 14px;

      border: 1px solid #526d5c;
      border-radius: 5px;
      background: transparent;

      color: #d4d8cf;
      font: 12px monospace;
      cursor: pointer;
    }

    #close-image:hover {
      background: #ffffff0a;
    }

    #close-image:focus-visible {
      outline: 2px solid #94aa98;
      outline-offset: 3px;
    }

    #image-viewer figure {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;

      flex: 1;
      min-height: 0;
      margin: 0;
      padding: 20px;
    }

    #enlarged-image {
      display: block;
      flex: 1;
      min-height: 0;

      width: 100%;
      object-fit: contain;
    }

    #enlarged-caption {
      flex-shrink: 0;
      max-width: 900px;
      max-height: 20%;
      overflow-y: auto;

      color: #a5aea5;
      font: 13px/1.6 system-ui, sans-serif;
      text-align: center;
    }

    /* Two-second welcome screen */
    #welcome-screen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;

      margin: 0;
      padding: 24px;
      border: none;

      background: #b8dce9;
      color: #294653;
    }

    #welcome-screen[open] {
      display: grid;
      place-items: center;
    }

    #welcome-screen::backdrop {
      background: #b8dce9;
    }

    #welcome-screen h1 {
      margin: 0;
      padding-left: 0.18em;

      font: 500 clamp(30px, 7vw, 80px) monospace;
      letter-spacing: 0.18em;
    }

    /* Decorative animation layer inside the expanded chip */
    #chip-background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    /* Keep text and controls above the animation. */
    #chip-panel .chip-toolbar,
    #chip-panel .panel-content {
      position: relative;
      z-index: 1;
    }

    .background-track,
    .background-signal {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .background-track {
      stroke-width: 1;
      opacity: 0.045;
    }

    .background-signal {
      stroke-width: 2;
      opacity: 0.22;
    }

    :root {
      --font-body: Arial, Helvetica, sans-serif;
      --font-mono: "Courier New", Courier, monospace;
    }

    /* Follow the available browser height, including mobile toolbars. */
    body {
      height: 100vh;
      height: 100dvh;
    }

    .circuit {
      width: 100%;
      height: 100%;
    }

    /* Explicit font choices reduce differences between computers. */
    .chip-index,
    .chip-name,
    .chip-description,
    .panel-eyebrow,
    #close-chip,
    #close-image,
    #welcome-screen h1 {
      font-family: var(--font-mono);
    }

    #chip-panel,
    #image-viewer {
      font-family: var(--font-body);
    }

    /* Keep the toolbar from being squeezed by long content. */
    .chip-toolbar {
      flex-shrink: 0;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
    }

    #panel-label {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    #close-chip,
    #close-image {
      min-height: 44px;
      flex-shrink: 0;
    }

    /* Readable text, with spacing that adjusts to the screen. */
    .panel-content {
      min-width: 0;
      padding: clamp(1rem, 3vw, 3rem);
      overflow-wrap: anywhere;
    }

    .panel-content h1 {
      font-size: clamp(2rem, 1.25rem + 3vw, 4rem);
      line-height: 1.15;
    }

    .panel-content h2 {
      font-size: clamp(1.2rem, 1rem + 0.6vw, 1.5rem);
    }

    .panel-content p,
    .panel-content li {
      font-size: 1rem;
      line-height: 1.75;
      max-width: 65ch;
    }

    .panel-content .panel-lead {
      font-size: clamp(1.125rem, 1rem + 0.6vw, 1.5rem);
    }

    .panel-content .panel-eyebrow {
      font-size: 0.75rem;
    }

    .panel-content img {
      max-width: 100%;
      height: auto;
    }

    /* On small screens, the content becomes a tall chip-like panel. */
    #chip-panel.compact-panel {
      border: 1px solid var(--panel-border);
      border-radius: 10px;
    }

    #chip-panel.compact-panel::backdrop {
      background: #111713d9;
    }

    /* Readable navigation for screens where the circuit is small. */
    .mobile-chip-nav {
      display: none;
    }

    @media (max-width: 700px), (max-height: 500px) {
      .mobile-chip-nav {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));

        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .mobile-chip-nav button {
        min-height: 44px;
        padding: 8px;

        border: 1px solid #526d5c;
        border-radius: 6px;
        background: #19231eed;
        color: #d4d8cf;

        font: 0.8rem var(--font-mono);
        cursor: pointer;
      }

      .mobile-chip-nav button:focus-visible {
        outline: 2px solid #a4d5ef;
        outline-offset: 2px;
      }

      .mobile-chip-nav button:disabled {
        opacity: 0.5;
        cursor: wait;
      }

      .chip-toolbar {
        padding: 0.75rem;
      }

      #image-viewer figure {
        padding: 10px;
      }
    }

    /* Leave room below the last paragraph for the floating button. */
    #panel-content {
      padding-bottom: 5rem;
    }

    #scroll-more {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;

      display: grid;
      place-items: center;

      width: 44px;
      height: 44px;
      padding: 0;

      border: 1px solid #ffffff30;
      border-radius: 50%;
      background: #080b09;
      color: #ffffff;
      box-shadow: 0 3px 12px #00000040;

      cursor: pointer;
    }

    #scroll-more[hidden] {
      display: none;
    }

    #scroll-more:hover {
      background: #202823;
    }

    #scroll-more:focus-visible {
      outline: 2px solid var(--panel-accent);
      outline-offset: 4px;
    }

    #scroll-more {
      width: 30px;
      height: 30px;
      min-width: 0;
      min-height: 0;
      bottom: 12px;
    }

    #scroll-more svg {
      width: 16px;
      height: 16px;
    }

    #welcome-screen {
      box-sizing: border-box;
      padding: 12px;
      overflow: auto;
    }

    .welcome-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #welcome-screen h1 {
      display: flex;
      justify-content: center;
      gap: 0.8vw;
      margin: 0;
      padding: 0;
      letter-spacing: 0;
      font-family: var(--font-mono, "Courier New", monospace);
      font-size: clamp(36px, 9vw, 88px);
      font-weight: 500;
      line-height: 1.2;

      transition: gap 900ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .welcome-character {
      position: relative;
      display: grid;
      place-items: center;
      flex: none;
      width: min(12vw, 132px);
      height: 1.3em;

      transition: width 900ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .welcome-character .binary,
    .welcome-character .letter {
      position: absolute;
      white-space: nowrap;
    }

    .welcome-character .binary {
      font-size: clamp(5px, 1.65vw, 18px);
      letter-spacing: 0;
      opacity: 1;
      transform: scaleX(1);
      filter: blur(0);

      transition:
        transform 650ms ease-in,
        opacity 650ms ease-in,
        filter 650ms ease-in;
    }

    .welcome-character .letter {
      opacity: 0;
      transform: scaleX(0.15);
      filter: blur(5px);

      transition:
        opacity 500ms ease-out 350ms,
        transform 500ms ease-out 350ms,
        filter 500ms ease-out 350ms;
    }

    /* Each byte compresses into its corresponding letter. */
    #welcome-title.decoded .binary {
      opacity: 0;
      transform: scaleX(0);
      filter: blur(3px);
    }

    #welcome-title.decoded .letter {
      opacity: 1;
      transform: scaleX(1);
      filter: blur(0);
    }

    /* Bring the separate letters together into one word. */
    #welcome-title.assembled {
      gap: 0;
    }

    #welcome-title.assembled .welcome-character {
      width: 0.62em;
    }

    /* Gold button, initially invisible and unavailable. */
    #synthesize-button {
      margin-top: 2rem;
      padding: 0.9rem 1.6rem;
      min-height: 44px;

      border: 1px solid #a67b25;
      border-radius: 6px;
      background: linear-gradient(135deg, #f2d58a, #c89b3c);
      color: #382a10;

      font-family: var(--font-mono, "Courier New", monospace);
      font-size: clamp(12px, 2vw, 16px);
      font-weight: 700;
      letter-spacing: 0.16em;

      box-shadow: 0 5px 22px #97701e25;
      cursor: pointer;

      visibility: hidden;
      opacity: 0;
      transform: translateY(12px);

      transition:
        opacity 600ms ease,
        transform 600ms ease,
        box-shadow 200ms ease;
    }

    #synthesize-button.visible {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }

    #synthesize-button:hover:not(:disabled) {
      box-shadow: 0 5px 28px #97701e55;
    }

    #synthesize-button:focus-visible {
      outline: 2px solid #294653;
      outline-offset: 5px;
    }

    #synthesize-button:disabled {
      cursor: default;
    }

    #welcome-status {
      min-height: 1.5em;
      margin: 1rem 0 0;
      font: 13px var(--font-mono, "Courier New", monospace);
      color: #294653;
    }

    @media (prefers-reduced-motion: reduce) {
      #welcome-screen *,
      #welcome-screen *::before,
      #welcome-screen *::after {
        transition: none !important;
      }
    }

    /* Fade from dark silicon to the existing light blue. */
    #welcome-screen,
    #welcome-screen::backdrop {
      animation: welcome-background-in 1000ms ease-out both;
    }

    @keyframes welcome-background-in {
      from { background-color: #111713; }
      to   { background-color: #b8dce9; }
    }

    /* Larger binary, still sized to fit all seven bytes. */
    #welcome-screen .welcome-character .binary {
      font-size: clamp(6px, 2.25vw, 26px);
    }

    /* Reserve space so revealing the icon doesn't shift the title. */
    #welcome-status {
      display: grid;
      place-items: center;
      height: 90px;
      min-height: 90px;
      margin: 1rem 0 0;
    }

    #circuit-builder {
      display: block;
      width: 100px;
      height: 84px;
      color: #294653;
      visibility: hidden;
    }

    #welcome-status.building #circuit-builder {
      visibility: visible;
    }

    /* Draw the chip first, then extend its wires outward. */
    #circuit-builder .build-core,
    #circuit-builder .build-traces path {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    #circuit-builder .build-nodes {
      opacity: 0;
    }

    .building .build-core {
      animation: circuit-draw 600ms ease-out forwards;
    }

    .building .build-traces path {
      animation: circuit-draw 1000ms ease-in-out 400ms forwards;
    }

    .building .build-nodes {
      animation: circuit-nodes-in 350ms ease-out 1300ms forwards;
    }

    @keyframes circuit-draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes circuit-nodes-in {
      to { opacity: 1; }
    }

    /* Status announcement for screen readers, without visible text. */
    .welcome-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      #welcome-screen,
      #welcome-screen::backdrop {
        animation: none;
        background-color: #b8dce9;
      }

      #welcome-status.building .build-core,
      #welcome-status.building .build-traces path {
        animation: none;
        stroke-dashoffset: 0;
      }

      #welcome-status.building .build-nodes {
        animation: none;
        opacity: 1;
      }
    }

    /* Thicker binary text */
    #welcome-screen .welcome-character .binary {
      font-weight: 1000;
    }

    /* Slightly darker light-blue background */
    #welcome-screen,
    #welcome-screen::backdrop {
      background-color: #578ae2;
    }

    @keyframes welcome-background-in {
      from { background-color: #111713; }
      to   { background-color: #578ae2; }
    }

    @media (prefers-reduced-motion: reduce) {
      #welcome-screen,
      #welcome-screen::backdrop {
        background-color: #578ae2;
      }
    }

    /* Soft halos inherit each chip's existing accent color. */
    .circuit .chip-body {
      filter: drop-shadow(0 0 6px var(--chip-accent));
      transition: filter 250ms ease;
    }

    @media (hover: hover) {
      .circuit > g[role="button"]:hover .chip-body {
        filter:
          drop-shadow(0 0 8px var(--chip-accent))
          drop-shadow(0 0 15px var(--chip-border));
      }
    }

    /* Brief illumination as the startup wave reaches each chip. */
    .circuit .power-arrival .chip-body {
      animation: chip-power-arrival 700ms ease-out;
    }

    @keyframes chip-power-arrival {
      0% {
        filter:
          brightness(1.4)
          drop-shadow(0 0 18px var(--chip-accent));
      }

      100% {
        filter:
          brightness(1)
          drop-shadow(0 0 6px var(--chip-accent));
      }
    }

    .board-effects {
      pointer-events: none;
    }

    .ambient-signal {
      opacity: 0.55;
      filter: drop-shadow(0 0 3px currentColor);
    }

    @media (prefers-reduced-motion: reduce) {
      .circuit .chip-body {
        transition: none;
      }

      .circuit .power-arrival .chip-body {
        animation: none;
      }
    }

    /* Decorative layer behind the circuit. */
    #board-grid-patches {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      transition: opacity 600ms ease;
    }

    #board-grid-patches.visible {
      opacity: 1;
    }

    /* Keep the circuit above the decorative background. */
    svg.circuit {
      position: relative;
      z-index: 1;
    }

    .grid-patch {
      position: absolute;
      inset: 0;

      /* Match the existing 24px background grid. */
      background-image:
        linear-gradient(
          to right,
          var(--patch-color) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          var(--patch-color) 1px,
          transparent 1px
        );

      background-size: 24px 24px;

      /* Illuminate only a soft, localized region of the grid. */
      -webkit-mask-image: radial-gradient(
        ellipse 220px 170px at var(--patch-x) var(--patch-y),
        #000 0%,
        transparent 100%
      );

      mask-image: radial-gradient(
        ellipse 220px 170px at var(--patch-x) var(--patch-y),
        #000 0%,
        transparent 100%
      );

      opacity: 0;
      animation: grid-patch-breathe var(--patch-duration) ease-in-out infinite;
      animation-delay: var(--patch-delay);
      animation-play-state: paused;
    }

    #board-grid-patches.visible .grid-patch {
      animation-play-state: running;
    }

    @keyframes grid-patch-breathe {
      0%, 100% { opacity: 0.025; }
      50%      { opacity: 1.0; }
    }

    /* Quiet, technical-looking board annotations. */
    .board-markings {
      pointer-events: none;
      opacity: 0;
      transition: opacity 600ms ease;
    }

    .circuit.board-decor-visible .board-markings {
      opacity: 0.42;
    }

    .board-markings text {
      fill: #8c9c8f;
      font-family: var(--font-mono, "Courier New", monospace);
      font-size: 7px;
      letter-spacing: 1.2px;
    }

    .board-markings path,
    .board-markings circle {
      fill: none;
      stroke: #819184;
      stroke-width: 0.8;
    }

    @media (prefers-reduced-motion: reduce) {
      #board-grid-patches,
      .board-markings {
        transition: none;
      }

      .grid-patch {
        animation: none;
        opacity: 0.08;
      }
    }

    .board-markings {
      display: none;
    }

    #board-grid-patches .grid-patch {
      animation: none;
      opacity: 0;
    }

    /* Shift the base grid and illuminated grid together. */
    body,
    #board-grid-patches .grid-patch {
      background-position:
        var(--grid-offset-x, 0px)
        var(--grid-offset-y, 0px);
    }

    .site-signature {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      z-index: 5;

      color: #b3bfb5;
	    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: clamp(10px, 1.0vw, 14px);
      letter-spacing: 0.06em;

      pointer-events: none;
      user-select: none;
    }

    /* Allow the intro chip to expand beyond its original bounds. */
    #welcome-screen.zooming-into-board {
      overflow: hidden;
    }

    #welcome-screen.zooming-into-board .welcome-content,
    #welcome-screen.zooming-into-board #welcome-status {
      overflow: visible;
    }

    #welcome-screen.zooming-into-board #circuit-builder {
      position: relative;
      z-index: 2;
      transform-origin: center;
      will-change: transform, opacity;
    }

    #welcome-screen.zooming-into-board::backdrop {
      animation: none;
      background: transparent;
    }

    /* Chip outline */
    #circuit-builder .build-core {
      stroke: #204954;
    }

    /* Inner core */
    #circuit-builder .build-core + .build-core {
      stroke: #9a7026;
    }

    /* Wires */
    #circuit-builder .build-traces {
      stroke: #8b5942;
    }

    /* Connection points */
    #circuit-builder .build-nodes {
      fill: #d09b40;
    }

    /* Remove the six mobile navigation buttons. */
    .mobile-chip-nav {
      display: none !important;
    }

    /* Smaller grid on phones.
      Update both layers so the glowing patches stay aligned. */
    @media (max-width: 700px) {
      body,
      #board-grid-patches .grid-patch {
        background-size: 14px 14px;
      }
    }
  </style>
</head>

            <li>Digital logic and hardware design</li>

      control: {
        label: "CONTROL UNIT",
        html: `
          <p class="panel-eyebrow">CUSTOM CPU & ASSEMBLER</p>
          <h1 id="chip-heading">From gates to instructions.</h1>

          <p class="panel-lead">
            A custom 8-bit processor with a 16-bit instruction set,
            built at the gate level.
          </p>

          <p>
            I built this processor in Digital Logic Sim, starting
            with basic circuits and working up to registers,
            an ALU, memory, and a control unit.
          </p>

          <h2>The hardware</h2>
          <p>
            The design brings together an 8-bit datapath,
            a register file, 256 bytes of RAM, and the control
            logic needed to execute its instruction set.
          </p>

          <h2>The assembler</h2>
          <p>
            A custom Python assembler translates assembly
            instructions into machine code for the processor.
          </p>

          <h2>Working within constraints</h2>
          <p>
            One interesting design decision was using the

    function getChipView(id) {
      const viewport = svg.getBoundingClientRect();
      const aspect = viewport.width / viewport.height;

      const matrix = chips[id].transform.baseVal.consolidate().matrix;
      const body = chips[id].querySelector(".chip-body");

      const centerX =
        matrix.e + Number(body.getAttribute("width")) / 2;

      const centerY =
        matrix.f + Number(body.getAttribute("height")) / 2;

      const width = Math.max(300, 220 * aspect);
      const height = width / aspect;

      return [
        centerX - width / 2,
        centerY - height / 2,
        width,
        height
      ];
    }

    function animateViewBox(destination) {
      const origin = svg
        .getAttribute("viewBox")
        .trim()
        .split(/[\s,]+/)
        .map(Number);

      if (reducedMotion.matches) {
        svg.setAttribute("viewBox", destination.join(" "));
        return Promise.resolve();
      }

      return new Promise(resolve => {
        let startTime;
        const duration = 850;

        function frame(time) {
          if (startTime === undefined) {
            startTime = time;
          }

          const progress = Math.min((time - startTime) / duration, 1);
          const eased = progress * progress * (3 - 2 * progress);

          const view = origin.map((value, index) =>
            value + (destination[index] - value) * eased
          );

          svg.setAttribute("viewBox", view.join(" "));

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            resolve();
          }
        }

        requestAnimationFrame(frame);
      });
    }

    function positionChipPanel(id) {
      const compact = window.matchMedia(
        "(max-width: 700px), (max-height: 500px)"
      ).matches;

      chipPanel.classList.toggle("compact-panel", compact);

      let left;
      let top;
      let width;
      let height;

      if (compact) {
        // Use nearly the whole screen on phones or short windows.
        const viewport = svg.getBoundingClientRect();
        const margin = 12;

        left = viewport.left + margin;
        top = viewport.top + margin;
        width = viewport.width - margin * 2;
        height = viewport.height - margin * 2;
      } else {
        // Preserve the "inside the chip" appearance on larger screens.
        const bounds = chips[id]
          .querySelector(".chip-inset")
          .getBoundingClientRect();

        const inset = 3;

        left = bounds.left + inset;
        top = bounds.top + inset;
        width = bounds.width - inset * 2;
        height = bounds.height - inset * 2;
      }

      chipPanel.style.left = `${left}px`;
      chipPanel.style.top = `${top}px`;
      chipPanel.style.width = `${Math.max(0, width)}px`;
      chipPanel.style.height = `${Math.max(0, height)}px`;
    }

    async function fadeChipPanel(opening) {
      if (reducedMotion.matches) return;

      const animation = chipPanel.animate(
        [
          { opacity: opening ? 0 : 1 },
          { opacity: opening ? 1 : 0 }
        ],
        {
          duration: opening ? 350 : 200,
          easing: "ease-in-out"
        }
      );

      await animation.finished;
    }

    const chipBackground = document.querySelector("#chip-background");

    const backgroundColors = [
      "#a4d5ef", // Light blue
      "#a8c7b0", // Soft green
      "#c4b4dc", // Lavender
      "#d5c39c", // Pale gold
      "#a8d3ce"  // Muted turquoise
    ];

    let backgroundFrame = null;
    let backgroundSignals = [];

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function createBackgroundPath() {
      const width = 1000;
      const height = 700;

      const horizontal = Math.random() < 0.5;
      const bent = Math.random() < 0.7;

      let points;

      if (horizontal) {
        const startY = randomBetween(40, height - 40);
        const endY = randomBetween(40, height - 40);
        const bendX = randomBetween(200, width - 200);

        points = bent
          ? [
              [0, startY],
              [bendX, startY],
              [bendX, endY],
              [width, endY]
            ]
          : [
              [0, startY],
              [width, startY]
            ];
      } else {
        const startX = randomBetween(40, width - 40);
        const endX = randomBetween(40, width - 40);
        const bendY = randomBetween(140, height - 140);

        points = bent
          ? [
              [startX, 0],
              [startX, bendY],
              [endX, bendY],
              [endX, height]
            ]
          : [
              [startX, 0],
              [startX, height]
            ];
      }

      // Allow travel in either direction.
      if (Math.random() < 0.5) {
        points.reverse();
      }

      return points
        .map(([x, y], index) =>
          `${index === 0 ? "M" : "L"} ${x} ${y}`
        )
        .join(" ");
    }

    function resetBackgroundSignal(signal, time, scatter = false) {
      const pathData = createBackgroundPath();

      const color = backgroundColors[
        Math.floor(Math.random() * backgroundColors.length)
      ];

      for (const path of [signal.track, signal.pulse]) {
        path.setAttribute("d", pathData);
        path.setAttribute("stroke", color);
      }

      signal.length = signal.pulse.getTotalLength();
      signal.duration = randomBetween(4500, 8500);
      signal.tail = randomBetween(25, 55);

      // Scatter initial positions so they don't all enter together.
      signal.start = scatter
        ? time - Math.random() * signal.duration
        : time + randomBetween(300, 1800);

      signal.pulse.setAttribute(
        "stroke-dasharray",
        `${signal.tail} ${signal.length + signal.tail * 2}`
      );
    }

    function stopChipBackground() {
      if (backgroundFrame !== null) {
        cancelAnimationFrame(backgroundFrame);
        backgroundFrame = null;
      }

      backgroundSignals = [];
      chipBackground.replaceChildren();
    }

    function startChipBackground() {
      stopChipBackground();

      if (reducedMotion.matches || !chipPanel.open) return;

      const namespace = "http://www.w3.org/2000/svg";
      const now = performance.now();

      // Six independent signals, each with its own path and speed.
      for (let i = 0; i < 6; i++) {
        const track = document.createElementNS(namespace, "path");
        const pulse = document.createElementNS(namespace, "path");

        track.setAttribute("class", "background-track");
        pulse.setAttribute("class", "background-signal");

        // Prevent an unstyled/full-path flash before the first frame.
        pulse.style.visibility = "hidden";

        chipBackground.append(track, pulse);

        const signal = { track, pulse };
        resetBackgroundSignal(signal, now, true);
        backgroundSignals.push(signal);
      }

      function frame(time) {
        if (!chipPanel.open) {
          stopChipBackground();
          return;
        }

        for (const signal of backgroundSignals) {
          if (time < signal.start) {
            signal.pulse.style.visibility = "hidden";
            continue;
          }

          const progress = (time - signal.start) / signal.duration;

          if (progress >= 1) {
            signal.pulse.style.visibility = "hidden";
            resetBackgroundSignal(signal, time);
            continue;
          }

          signal.pulse.style.visibility = "visible";

          // Move a short illuminated segment along the path.
          const distance =
            progress * (signal.length + signal.tail * 2);

          signal.pulse.setAttribute(
            "stroke-dashoffset",
            signal.tail - distance
          );
        }

        backgroundFrame = requestAnimationFrame(frame);
      }

      backgroundFrame = requestAnimationFrame(frame);
    }

    // Stop rendering when the chip is closed.
    chipPanel.addEventListener("close", stopChipBackground);

    // Respect a motion-preference change while the page is open.
    reducedMotion.addEventListener("change", () => {
      if (reducedMotion.matches) {
        stopChipBackground();
      } else if (chipPanel.open) {
        startChipBackground();
      }
    });

    async function openChip(id) {
      if (openChipId !== null || cameraMoving) return;

      cameraMoving = true;

      try {
        const page = chipPages[id];
        const colors = getComputedStyle(chips[id]);

        chipPanel.style.setProperty(
          "--panel-fill",
          colors.getPropertyValue("--chip-fill").trim()
        );

        chipPanel.style.setProperty(
          "--panel-border",
          colors.getPropertyValue("--chip-border").trim()
        );

        chipPanel.style.setProperty(
          "--panel-accent",
          colors.getPropertyValue("--chip-accent").trim()
        );

        panelLabel.textContent = page.label;
        panelContent.innerHTML = page.html;

        // Fade out the small labels while zooming toward the chip.
        chips[id].classList.add("content-open");

        await animateViewBox(getChipView(id));

        svg.setAttribute("viewBox", getChipView(id).join(" "));
        positionChipPanel(id);

        chipPanel.showModal();
        openChipId = id;
        panelContent.scrollTop = 0;
        startChipBackground();

        // Fade in the full content after arriving.
        await fadeChipPanel(true);
      } finally {
        cameraMoving = false;

        // Keep the panel aligned if the window resized during the fade.
        if (openChipId !== null) {
          svg.setAttribute(
            "viewBox",
            getChipView(openChipId).join(" ")
          );

          positionChipPanel(openChipId);
        }
      }
    }

    async function closeChip() {
      if (openChipId === null || cameraMoving) return;

      cameraMoving = true;
      const id = openChipId;

      try {
        // Fade away the full content first.
        await fadeChipPanel(false);

        chipPanel.close();
        openChipId = null;

        // Restore the small labels as we zoom back out.
        chips[id].classList.remove("content-open");

        await animateViewBox(overviewView);

        chips[id].focus({ preventScroll: true });
      } finally {
        cameraMoving = false;
      }
    }

    closeChipButton.addEventListener("click", closeChip);

    chipPanel.addEventListener("cancel", event => {
      event.preventDefault();
      closeChip();
    });

    window.addEventListener("resize", () => {
      if (openChipId === null || cameraMoving) return;

      svg.setAttribute("viewBox", getChipView(openChipId).join(" "));
      positionChipPanel(openChipId);
    });

    function findConnection(from, to) {
      return connections.find(connection =>
        (connection.from === from && connection.to === to) ||
        (connection.from === to && connection.to === from)
      );
    }

    function findRoute(start, destination) {
      const queue = [[start]];
      const visited = new Set([start]);

      while (queue.length > 0) {
        const route = queue.shift();
        const current = route[route.length - 1];

        if (current === destination) {
          return route;
        }

        // Every wired connection can be used in either direction.
        for (const connection of connections) {
          let neighbor;

          if (connection.from === current) {
            neighbor = connection.to;
          } else if (connection.to === current) {
            neighbor = connection.from;
          } else {
            continue;
          }

          if (!visited.has(neighbor)) {
            visited.add(neighbor);
            queue.push([...route, neighbor]);
          }
        }
      }

      return null;
    }

    function showCurrentChip() {
      for (const [id, chip] of Object.entries(chips)) {
        const selected = id === currentChip;

        chip.classList.toggle("is-current", selected);
        chip.setAttribute("aria-pressed", String(selected));
      }

      const neighbors = connections
        .filter(connection =>
          connection.from === currentChip ||
          connection.to === currentChip
        )
        .map(connection =>
          connection.from === currentChip
            ? connection.to
            : connection.from
        );

      status.textContent =
        `${names[currentChip]} · Connected to: ` +
        neighbors.map(id => names[id]).join(", ");
    }

    function setTravelling(value) {
      travelling = value;

      for (const chip of Object.values(chips)) {
        chip.setAttribute("aria-disabled", String(value));
      }

      document.querySelectorAll(".mobile-chip-nav button").forEach(button => {
        button.disabled = value;
      });
    }

    function makePulse(path) {
      const circle = document.createElementNS(SVG_NS, "circle");

      const color = path.classList.contains("wire-ternary")
        ? "ternary"
        : path.classList.contains("wire-secondary")
          ? "secondary"
          : "primary";

      circle.setAttribute("class", `signal-pulse ${color}`);
      circle.setAttribute("r", color === "primary" ? "4" : "3");

      return {
        circle,
        path,
        length: path.getTotalLength()
      };
    }

    function positionPulse(signal, progress, reverse) {
      // Reverse travel counts down from 100% to 0%.
      const fraction = reverse ? 1 - progress : progress;

      const point = signal.path.getPointAtLength(
        signal.length * fraction
      );

      signal.circle.setAttribute("cx", point.x);
      signal.circle.setAttribute("cy", point.y);
    }

    function animateConnection(connection, reverse) {
      const signals = connection.paths.map(makePulse);

      // Position every pulse before displaying any of them.
      for (const signal of signals) {
        positionPulse(signal, 0, reverse);
      }

      pulseLayer.append(...signals.map(signal => signal.circle));

      return new Promise(resolve => {
        let startTime;

        function frame(time) {
          if (startTime === undefined) {
            startTime = time;
          }

          const progress = Math.min(
            (time - startTime) / TRAVEL_TIME,
            1
          );

          // One shared clock updates all three signals.
          for (const signal of signals) {
            positionPulse(signal, progress, reverse);
          }

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            // Leave the final positions for one rendered frame.
            requestAnimationFrame(() => {
              for (const signal of signals) {
                signal.circle.remove();
              }

              resolve();
            });
          }
        }

        requestAnimationFrame(frame);
      });
    }

    async function travelTo(destination) {
      if (travelling || cameraMoving || openChipId !== null) return;

      // Reopen the current chip without sending another pulse.
      if (destination === currentChip) {
        await openChip(destination);
        return;
      }

      const route = findRoute(currentChip, destination);

      if (!route) {
        status.textContent =
          `No route from ${names[currentChip]} to ${names[destination]}.`;

        return;
      }

      setTravelling(true);

      try {
        for (let i = 0; i < route.length - 1; i++) {
          const from = route[i];
          const to = route[i + 1];

          const connection = findConnection(from, to);
          const reverse = connection.to === from;

          status.textContent =
            route.map(id => names[id]).join(" → ") +
            ` · Step ${i + 1} of ${route.length - 1}`;

          if (!reducedMotion.matches) {
            await animateConnection(connection, reverse);
          }

          currentChip = to;
          showCurrentChip();
        }

        // Open only the final destination, not intermediate chips.
        await openChip(destination);
      } finally {
        pulseLayer.replaceChildren();
        setTravelling(false);
      }
    }

    // Support both clicking and keyboard navigation.

          travelTo(id);

    showCurrentChip();

    const imageViewer = document.querySelector("#image-viewer");
    const enlargedImage = document.querySelector("#enlarged-image");
    const enlargedCaption = document.querySelector("#enlarged-caption");
    const closeImageButton = document.querySelector("#close-image");

    let imageOpener = null;
    let savedPanelScroll = 0;

    panelContent.addEventListener("click", event => {

      const image = button.querySelector("img");
      if (!image) return;

    function closeImageViewer() {

    closeImageButton.addEventListener("click", closeImageViewer);

    const welcomeScreen = document.querySelector("#welcome-screen");

    async function zoomIntoSynthesizedChip() {
      if (reducedMotion.matches) return;

      const builder = document.querySelector("#circuit-builder");
      const welcomeContent = welcomeScreen.querySelector(".welcome-content");

      welcomeScreen.classList.add("zooming-into-board");

      // Freeze the background's current color before fading it.
      // This overrides the earlier background entrance animation.
      const startingColor = getComputedStyle(welcomeScreen).backgroundColor;
      welcomeScreen.style.animation = "none";
      welcomeScreen.style.backgroundColor = startingColor;

      // Stop interaction while entering the circuit.
      welcomeContent.style.pointerEvents = "none";

      const bounds = builder.getBoundingClientRect();

      // The inner chip body occupies 40 × 40 units
      // within the icon's 120 × 100 viewBox.
      const svgUnit = Math.min(bounds.width / 120, bounds.height / 100);
      const chipSize = 40 * svgUnit;

      const targetScale =
        Math.max(
          window.innerWidth / chipSize,
          window.innerHeight / chipSize
        ) * 1.2;

      const moveX =
        window.innerWidth / 2 - (bounds.left + bounds.width / 2);

      const moveY =
        window.innerHeight / 2 - (bounds.top + bounds.height / 2);

      const duration = 1500;

      const titleFade = welcomeTitle.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        { duration: 350, fill: "forwards" }
      );

      const buttonFade = synthesizeButton.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        { duration: 350, fill: "forwards" }
      );

      const chipZoom = builder.animate(
        [
          {
            transform: "translate(0, 0) scale(1)",
            opacity: 1
          },
          {
            transform:
              `translate(${moveX * 0.3}px, ${moveY * 0.3}px) scale(1.8)`,
            opacity: 1,
            offset: 0.3
          },
          {
            transform:
              `translate(${moveX}px, ${moveY}px) scale(${targetScale})`,
            opacity: 0
          }
        ],
        {
          duration,
          easing: "cubic-bezier(0.65, 0, 0.35, 1)",
          fill: "forwards"
        }

        [
          { backgroundColor: startingColor },

        {
          duration: 900,
          delay: 300,
          fill: "forwards"

      );

      await Promise.all([
        titleFade.finished,
        buttonFade.finished,
        chipZoom.finished,
        backgroundFade.finished

      // Reveal the real circuit beneath the enlarged intro chip.
      await welcomeScreen.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        {
          duration: 450,
          easing: "ease-out",
          fill: "forwards"
        }
      ).finished;

    async function animateWelcome() {

        await introWait(1100);

        welcomeTitle.classList.add("assembled");

    animateWelcome();

    function fitChipLabels() {
      for (const chip of Object.values(chips)) {
        const body = chip.querySelector(".chip-body");
        const chipWidth = Number(body.getAttribute("width"));

        for (const text of chip.querySelectorAll("text")) {
          // Remember the intended size before applying any adjustment.
          if (!text.dataset.baseFontSize) {
            text.dataset.baseFontSize =
              parseFloat(getComputedStyle(text).fontSize);
          }

          const baseSize = Number(text.dataset.baseFontSize);
          text.style.fontSize = `${baseSize}px`;

          const leftMargin = Number(text.getAttribute("x") || 24);
          const availableWidth = chipWidth - leftMargin - 24;

          // Support both single-line text and manual tspan line breaks.
          const lines = text.querySelectorAll("tspan");
          const elements = lines.length ? Array.from(lines) : [text];

          const measuredWidth = Math.max(
            ...elements.map(line => line.getComputedTextLength())
          );

          if (measuredWidth > availableWidth && availableWidth > 0) {
            const fittedSize = baseSize * availableWidth / measuredWidth;
            text.style.fontSize = `${fittedSize}px`;
          }
        }
      }
    }

    document.fonts.ready.then(fitChipLabels);

    const mobileChipButtons = document.querySelectorAll(
      ".mobile-chip-nav button"
    );

    for (const button of mobileChipButtons) {
      button.addEventListener("click", () => {
        travelTo(button.dataset.chip);
      });
    }

    const scrollMoreButton = document.querySelector("#scroll-more");

    // Allow the content area to receive focus without entering the Tab order.
    panelContent.setAttribute("tabindex", "-1");

    function updateScrollIndicator() {
      const remaining =
        panelContent.scrollHeight -
        panelContent.clientHeight -
        panelContent.scrollTop;

      const show =
        chipPanel.open &&
        panelContent.clientHeight > 0 &&
        remaining > 4;

      // Avoid losing keyboard focus when the button disappears.
      if (!show && document.activeElement === scrollMoreButton) {
        panelContent.focus({ preventScroll: true });
      }

      scrollMoreButton.hidden = !show;
    }

    scrollMoreButton.addEventListener("click", () => {
      panelContent.scrollBy({
        top: panelContent.clientHeight * 0.75,
        behavior: reducedMotion.matches ? "auto" : "smooth"
      });
    });

    // Update as the visitor scrolls.
    panelContent.addEventListener(
      "scroll",
      updateScrollIndicator,
      { passive: true }
    );

    // Recheck when the available reading area changes.
    const scrollSizeObserver = new ResizeObserver(updateScrollIndicator);
    scrollSizeObserver.observe(panelContent);

    // Observe new content and its dimensions, including images.
    const scrollContentObserver = new MutationObserver(() => {
      scrollSizeObserver.disconnect();
      scrollSizeObserver.observe(panelContent);

      for (const child of panelContent.children) {
        scrollSizeObserver.observe(child);
      }

      updateScrollIndicator();
    });

    scrollContentObserver.observe(panelContent, {
      childList: true,
      subtree: true,
      characterData: true
    });

    // Images may finish loading after the chip has opened.
    panelContent.addEventListener("load", updateScrollIndicator, true);
    panelContent.addEventListener("error", updateScrollIndicator, true);

    // Detect opening and closing of the dialog.
    const scrollDialogObserver = new MutationObserver(
      updateScrollIndicator
    );

    scrollDialogObserver.observe(chipPanel, {
      attributes: true,
      attributeFilter: ["open"]
    });

    document.fonts.ready.then(updateScrollIndicator);
    updateScrollIndicator();

    // ── Decorative circuit effects ──────────────────────────────

    let boardEffectsStarted = false;

    const ambientLayer = document.createElementNS(SVG_NS, "g");
    ambientLayer.classList.add("board-effects");
    ambientLayer.setAttribute("aria-hidden", "true");

    // Separate from navigation pulses so they don't interfere.
    wires.after(ambientLayer);

    function boardIsIdle() {
      return (
        !document.hidden &&
        !reducedMotion.matches &&
        !travelling &&
        !cameraMoving &&
        openChipId === null &&
        !chipPanel.open
      );
    }

    // ── Startup power wave ─────────────────────────────────────

    function playPowerWave() {
      if (!boardIsIdle()) return;

      // Convert the visible SVG viewport into circuit coordinates.
      // This includes the extra space around the preserved viewBox.
      const bounds = svg.getBoundingClientRect();
      const inverse = svg.getScreenCTM().inverse();

      function screenToCircuit(x, y) {
        const point = svg.createSVGPoint();
        point.x = x;
        point.y = y;
        return point.matrixTransform(inverse);
      }

      const topLeft = screenToCircuit(bounds.left, bounds.top);
      const bottomRight = screenToCircuit(bounds.right, bounds.bottom);

      const viewX = topLeft.x;
      const viewY = topLeft.y;
      const viewWidth = bottomRight.x - topLeft.x;
      const viewHeight = bottomRight.y - topLeft.y;

      const bandWidth = viewWidth * 0.22;

      const layer = document.createElementNS(SVG_NS, "g");
      layer.classList.add("board-effects");
      layer.setAttribute("aria-hidden", "true");

      // A moving blue-and-gold band.
      layer.innerHTML = `
        <defs>
          <linearGradient
            id="board-power-gradient"
            gradientUnits="userSpaceOnUse"
            x1="0" y1="0"
            x2="${bandWidth}" y2="0"
          >
            <stop offset="0" stop-color="#91bfd3" stop-opacity="0"/>
            <stop offset="0.40" stop-color="#91bfd3" stop-opacity="0.6"/>
            <stop offset="0.65" stop-color="#e1bd74" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#e1bd74" stop-opacity="0"/>
          </linearGradient>
        </defs>
      `;

      const gradient = layer.querySelector("linearGradient");

      const wash = document.createElementNS(SVG_NS, "rect");
      wash.setAttribute("x", viewX);
      wash.setAttribute("y", viewY);
      wash.setAttribute("width", viewWidth);
      wash.setAttribute("height", viewHeight);
      wash.setAttribute("fill", "url(#board-power-gradient)");
      wash.setAttribute("opacity", "0.12");
      layer.append(wash);

      // Copies light up the wires without changing the real paths.
      for (const connection of connections) {
        for (const path of connection.paths) {
          const highlight = document.createElementNS(SVG_NS, "path");

          highlight.setAttribute("d", path.getAttribute("d"));
          highlight.setAttribute("fill", "none");
          highlight.setAttribute("stroke", "url(#board-power-gradient)");
          highlight.setAttribute("stroke-width", "2");
          highlight.setAttribute("opacity", "0.8");

          layer.append(highlight);
        }
      }

      wires.after(layer);

      const chipCenters = Object.values(chips).map(chip => {
        const box = chip.getBBox();
        const transform = chip.transform.baseVal.consolidate();
        const point = svg.createSVGPoint();

        point.x = box.x + box.width / 2;
        point.y = box.y + box.height / 2;

        return {
          chip,
          x: transform ? point.matrixTransform(transform.matrix).x : point.x,
          illuminated: false
        };
      });

      const duration = 2000;
      const start = performance.now();

      function frame(now) {
        if (!boardIsIdle()) {
          layer.remove();
          return;
        }

        const progress = Math.min((now - start) / duration, 1);
        const bandX =
          viewX - bandWidth + progress * (viewWidth + 2 * bandWidth);

        gradient.setAttribute(
          "gradientTransform",
          `translate(${bandX} 0)`
        );

        for (const item of chipCenters) {
          if (!item.illuminated && bandX + bandWidth * 0.65 >= item.x) {
            item.illuminated = true;
            item.chip.classList.add("power-arrival");

            setTimeout(() => {
              item.chip.classList.remove("power-arrival");
            }, 700);
          }
        }

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          layer.remove();
        }
      }

      requestAnimationFrame(frame);
    }

    // ── Occasional ambient wire signals ────────────────────────

    function playAmbientSignals() {
      if (!boardIsIdle() || connections.length === 0) return;

      const connection =
        connections[Math.floor(Math.random() * connections.length)];

      const reverse = Math.random() < 0.5;
      const colors = ["#b9a17b", "#a5b99e", "#91bfd3"];

      const signals = connection.paths.map((path, index) => {
        const dot = document.createElementNS(SVG_NS, "circle");
        const color = colors[index % colors.length];

        dot.classList.add("ambient-signal");
        dot.setAttribute("r", "1.8");
        dot.setAttribute("fill", color);
        dot.style.color = color;

        return {
          path,
          dot,
          length: path.getTotalLength()
        };
      });

      const duration = 2200;
      const start = performance.now();

      function frame(now) {
        // Immediately clear ambient signals if navigation begins.
        if (!boardIsIdle()) {
          signals.forEach(signal => signal.dot.remove());
          return;
        }

        const progress = Math.min((now - start) / duration, 1);

        for (const signal of signals) {
          const position = reverse ? 1 - progress : progress;
          const point = signal.path.getPointAtLength(
            position * signal.length
          );

          signal.dot.setAttribute("cx", point.x);
          signal.dot.setAttribute("cy", point.y);

          // Fade gently at both ends.
          signal.dot.style.opacity =
            0.55 * Math.sin(Math.PI * progress);

          if (!signal.dot.parentNode) {
            ambientLayer.append(signal.dot);
          }
        }

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          signals.forEach(signal => signal.dot.remove());
        }
      }

      requestAnimationFrame(frame);
    }

    function scheduleAmbientSignals() {
      // One group every 4–7 seconds.
      setTimeout(() => {
        playAmbientSignals();
        scheduleAmbientSignals();
      }, 4000 + Math.random() * 3000);
    }

    function startBoardEffects() {
      if (boardEffectsStarted) return;
      boardEffectsStarted = true;

      playPowerWave();
      scheduleAmbientSignals();
    }

    // ── Illuminated background grid patches ────────────────────

    const gridPatchLayer = document.createElement("div");
    gridPatchLayer.id = "board-grid-patches";
    gridPatchLayer.setAttribute("aria-hidden", "true");

    document.body.prepend(gridPatchLayer);

    const PATCH_COUNT = 6;

    // Duration of one complete fade in and fade out.
    const PATCH_GLOW_MIN = 5000;
    const PATCH_GLOW_MAX = 10000;

    // Darkness between glows.
    const PATCH_PAUSE_MIN = 800;
    const PATCH_PAUSE_MAX = 1500;

    // Maximum brightness: 0 = invisible, 1 = fully opaque.
    const PATCH_BRIGHTNESS = 0.75;

    const patchColors = [
      "#91bfd3", // Light blue
      "#b9a17b", // Gold
      "#94aa98", // Sage green
      "#aa99b7", // Lavender
      "#7fb8ad", // Teal
      "#c39791"  // Soft coral
    ];

    function randomPatchValue(min, max) {
      return min + Math.random() * (max - min);
    }

    function randomizePatch(patch) {
      patch.style.setProperty(
        "--patch-x",
        `${randomPatchValue(5, 95)}%`
      );

      patch.style.setProperty(
        "--patch-y",
        `${randomPatchValue(5, 95)}%`
      );

      patch.style.setProperty(
        "--patch-color",
        patchColors[Math.floor(Math.random() * patchColors.length)]
      );
    }

    const patchStates = Array.from({ length: PATCH_COUNT }, () => {
      const patch = document.createElement("div");
      patch.className = "grid-patch";

      randomizePatch(patch);
      gridPatchLayer.append(patch);

      return {
        patch,
        animation: null,
        timer: null
      };
    });

    let patchGlowsRunning = false;

    function schedulePatchGlow(state, delay) {
      state.timer = setTimeout(() => {
        state.timer = null;

        if (!patchGlowsRunning) return;

        // Move only while invisible, so patches never jump mid-glow.
        randomizePatch(state.patch);

        const animation = state.patch.animate(
          [
            { opacity: 0, offset: 0 },
            { opacity: PATCH_BRIGHTNESS, offset: 0.5 },
            { opacity: 0, offset: 1 }
          ],
          {
            duration: randomPatchValue(PATCH_GLOW_MIN, PATCH_GLOW_MAX),
            easing: "ease-in-out"
          }
        );

        state.animation = animation;

        animation.onfinish = () => {
          state.animation = null;

          if (patchGlowsRunning) {
            schedulePatchGlow(
              state,
              randomPatchValue(PATCH_PAUSE_MIN, PATCH_PAUSE_MAX)
            );
          }
        };
      }, delay);
    }

    function syncPatchGlows() {
      const visible = gridPatchLayer.classList.contains("visible");
      const shouldRun = visible && !reducedMotion.matches;

      if (shouldRun === patchGlowsRunning) return;
      patchGlowsRunning = shouldRun;

      for (const state of patchStates) {
        clearTimeout(state.timer);
        state.timer = null;

        state.animation?.cancel();
        state.animation = null;

        if (shouldRun) {
          schedulePatchGlow(state, randomPatchValue(0, 2000));
        }
      }
    }

    const patchVisibilityObserver = new MutationObserver(syncPatchGlows);

    patchVisibilityObserver.observe(gridPatchLayer, {
      attributes: true,
      attributeFilter: ["class"]
    });

    reducedMotion.addEventListener("change", syncPatchGlows);
    syncPatchGlows();

    // ── PCB-style markings ─────────────────────────────────────

    const boardMarkings = document.createElementNS(SVG_NS, "g");
    boardMarkings.classList.add("board-markings");
    boardMarkings.setAttribute("aria-hidden", "true");

    // Positions use your existing circuit's SVG coordinates.
    boardMarkings.innerHTML = `
      <g transform="translate(80 35)">
        <path d="M0 12 V0 H12"/>
        <text x="20" y="5">PERSONAL SYSTEM / REV 01</text>
        <text x="20" y="18">ARCHITECTURE · PROJECTS · IDEAS</text>
      </g>

      <g transform="translate(730 40)">
        <circle cx="0" cy="0" r="4"/>
        <path d="M-7 0 H7 M0 -7 V7"/>
        <text x="13" y="3">TP01 / CLK</text>
      </g>

      <g transform="translate(625 710)">
        <path d="M0 0 H55 M0 5 H32"/>
        <text x="0" y="20">SIGNAL BUS</text>
        <text x="0" y="32">BIDIRECTIONAL</text>
      </g>

      <g transform="translate(1045 380)">
        <circle cx="0" cy="0" r="4"/>
        <circle cx="18" cy="0" r="4"/>
        <text x="30" y="3">TP02 / DATA</text>
      </g>

      <g transform="translate(80 745)">
        <path d="M0 -12 V0 H12"/>
        <text x="20" y="-2">DESIGNED BY ARNAV</text>
      </g>
    `;

    // Draw behind wires and chips.
    wires.before(boardMarkings);

    // ── Show only after startup, and outside expanded chips ─────

    let boardDecorationStarted = false;

    function updateBoardDecoration() {
      const visible =
        boardDecorationStarted &&
        !document.hidden;

      gridPatchLayer.classList.toggle("visible", visible);
      svg.classList.toggle("board-decor-visible", visible);
    }

    function startBoardDecoration() {
      boardDecorationStarted = true;
      updateBoardDecoration();
    }

    const boardDecorationObserver = new MutationObserver(
      updateBoardDecoration
    );

    boardDecorationObserver.observe(chipPanel, {
      attributes: true,
      attributeFilter: ["open"]
    });

    document.addEventListener(
      "visibilitychange",
      updateBoardDecoration
    );

    // Maximum grid movement in either direction, in pixels.
    const GRID_DEPTH = 8;

    const depthPointer = window.matchMedia(
      "(hover: hover) and (pointer: fine)"
    );

    let depthX = 0;
    let depthY = 0;
    let depthTargetX = 0;
    let depthTargetY = 0;
    let depthFrame = null;

    function depthIsEnabled() {
      return (
        depthPointer.matches &&
        !reducedMotion.matches &&
        !document.hidden &&
        gridPatchLayer.classList.contains("visible")
      );
    }

    function renderGridDepth() {
      document.body.style.setProperty("--grid-offset-x", `${depthX}px`);
      document.body.style.setProperty("--grid-offset-y", `${depthY}px`);
    }

    function animateGridDepth() {
      depthFrame = null;

      // Ease toward the pointer instead of snapping.
      depthX += (depthTargetX - depthX) * 0.08;
      depthY += (depthTargetY - depthY) * 0.08;

      const settled =
        Math.abs(depthTargetX - depthX) < 0.02 &&
        Math.abs(depthTargetY - depthY) < 0.02;

      if (settled) {
        depthX = depthTargetX;
        depthY = depthTargetY;
      }

      renderGridDepth();

      if (!settled) {
        depthFrame = requestAnimationFrame(animateGridDepth);
      }
    }

    function setGridDepthTarget(x, y) {
      depthTargetX = x;
      depthTargetY = y;

      if (depthFrame === null) {
        depthFrame = requestAnimationFrame(animateGridDepth);
      }
    }

    window.addEventListener("pointermove", event => {
      if (!depthIsEnabled() || event.pointerType !== "mouse") return;

      // Move slightly opposite the cursor.
      setGridDepthTarget(
        -(event.clientX / window.innerWidth - 0.5) * 2 * GRID_DEPTH,
        -(event.clientY / window.innerHeight - 0.5) * 2 * GRID_DEPTH
      );
    }, { passive: true });

    document.documentElement.addEventListener("pointerleave", () => {
      setGridDepthTarget(0, 0);
    });

    function resetGridDepth() {
      if (depthFrame !== null) {
        cancelAnimationFrame(depthFrame);
        depthFrame = null;
      }

      depthX = depthY = depthTargetX = depthTargetY = 0;
      renderGridDepth();
    }

    function syncGridDepth() {
      if (!depthIsEnabled()) resetGridDepth();
    }

    const depthVisibilityObserver = new MutationObserver(syncGridDepth);

    depthVisibilityObserver.observe(gridPatchLayer, {
      attributes: true,
      attributeFilter: ["class"]
    });

    reducedMotion.addEventListener("change", syncGridDepth);
    depthPointer.addEventListener("change", syncGridDepth);
    document.addEventListener("visibilitychange", syncGridDepth);
    window.addEventListener("blur", resetGridDepth);
  </script>
</body>
</html>
